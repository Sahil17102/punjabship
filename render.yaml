services:
  - type: web
    name: punjabship
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://PunjabShip-logisticbackend.onrender.com
      - key: BACKEND_URL
        value: https://PunjabShip-logisticbackend.onrender.com
      - key: FRONTEND_URL
        value: https://punjabship.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0, s-maxage=0
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
