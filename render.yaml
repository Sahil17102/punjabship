services:
  - type: web
    name: punjabship
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://PunjabShip-logisticbackend.onrender.com
      - key: BACKEND_URL
        value: https://PunjabShip-logisticbackend.onrender.com
      - key: FRONTEND_URL
        value: https://punjabship.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0, s-maxage=0
      - path: /*
        name: Pragma
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: punjabshipclient1
    runtime: static
    rootDir: panels/punjabship-panels/courier-cart-client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://punjabship-logisticbackend.onrender.com/api
      - key: VITE_APP_SOCKET_URL
        value: https://punjabship-logisticbackend.onrender.com
      - key: VITE_ADMIN_URL
        value: https://punjabshipadmin.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: punjabshipadmin
    runtime: static
    rootDir: panels/punjabship-panels/admin-dashboard
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://punjabship-logisticbackend.onrender.com/api
      - key: REACT_APP_SOCKET_URL
        value: https://punjabship-logisticbackend.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
