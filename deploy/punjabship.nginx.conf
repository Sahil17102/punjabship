server {
    listen 80;
    listen [::]:80;
    server_name punjabship.com www.punjabship.com;

    root /var/www/punjabship/landing;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(weight-calculator|rate-calculator|tracking)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(blogs|integrations)(/.*)?$ {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /seller-static/ {
        alias /var/www/punjabship/seller/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(images|logo|pincodes|templates)/ {
        root /var/www/punjabship/seller;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location = /manifest.json { alias /var/www/punjabship/seller/manifest.json; }
    location = /API_DOCUMENTATION.pdf { alias /var/www/punjabship/seller/API_DOCUMENTATION.pdf; }
    location = /sample-b2c-bulk-upload.csv { alias /var/www/punjabship/seller/sample-b2c-bulk-upload.csv; }

    location / {
        root /var/www/punjabship/seller;
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.punjabship.com;

    root /var/www/punjabship/admin;
    index index.html;

    location /static/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.punjabship.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
